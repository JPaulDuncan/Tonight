name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generators:
    name: Generator library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r tools/requirements.txt

      - name: Generator library tests
        # These run WITHOUT Blender. That is the point of the lib/scripts split
        # in ADR-0004: the geometry logic is where the bugs are, so it must be
        # testable on every push rather than only when someone opens Blender.
        run: python -m pytest blender/tests -q

      - name: Tooling tests
        run: python -m pytest tools/tests -q

      - name: Full generator dry run
        # Exercises every generator and the pre-export checks, and rewrites the
        # manifest, all without bpy.
        run: python blender/scripts/build_all.py -- --dry-run

      - name: Manifest is up to date
        # Content hashes in the manifest are how a generator change is reviewed.
        # A stale manifest means the committed hashes no longer describe what
        # the generators actually produce, which silently defeats that review.
        run: |
          if ! git diff --quiet -- blender/exports/manifest.json; then
            echo "::error::blender/exports/manifest.json is out of date."
            echo "Run: python3 blender/scripts/build_all.py -- --dry-run"
            echo "and commit the result."
            git diff -- blender/exports/manifest.json
            exit 1
          fi
          echo "Manifest matches the generators."

  blueprints:
    name: Blueprint validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Seed assets are up to date
        # The seed Blueprints are generated from tools/seed_blueprints.py. A
        # hand-edit to a generated .asset would be silently overwritten on the
        # next run, so the generator is the place to make the change.
        run: python tools/seed_blueprints.py --check

      - name: Validate Blueprint assets
        # Cross-asset checks a single asset cannot perform: duplicate
        # identities, storm phase radius discontinuities, loot table cycles,
        # orphaned .meta files.
        run: python tools/validate_blueprints.py

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No exported binaries committed
        # blender/exports is build output (ADR-0004). A committed FBX means
        # someone's local build is now the source of truth instead of the
        # Python, which is exactly the situation the pipeline exists to avoid.
        run: |
          found=$(git ls-files 'blender/exports/**' \
            | grep -Ei '\.(fbx|glb|gltf|obj|blend)$' || true)
          if [ -n "$found" ]; then
            echo "::error::Exported binaries are committed:"
            echo "$found"
            exit 1
          fi
          echo "No exported binaries in git."

      - name: No orphaned Unity meta files
        run: |
          status=0
          while IFS= read -r meta; do
            asset="${meta%.meta}"
            if [ ! -e "$asset" ]; then
              echo "::error file=$meta::Orphaned .meta with no asset"
              status=1
            fi
          done < <(git ls-files 'unity/**/*.meta')
          exit $status

      - name: Documented systems have specs
        # A system whose spec went missing is a system nobody can review.
        run: |
          status=0
          for spec in movement building combat harvesting loot storm \
                      inventory netcode match-flow; do
            if [ ! -f "docs/systems/$spec.md" ]; then
              echo "::error::Missing spec docs/systems/$spec.md"
              status=1
            fi
          done
          exit $status

  # Unity EditMode tests need a licensed runner, which a public fork cannot
  # provide. The job is defined so the wiring is reviewable and is enabled the
  # moment UNITY_LICENSE is available; ADR-0005 rule 5's insistence that
  # nothing REQUIRE a GUI is what keeps the jobs above meaningful without it.
  unity-tests:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: unity/Tonight/Library
          key: Library-${{ hashFiles('unity/Tonight/Packages/manifest.json') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity/Tonight
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
