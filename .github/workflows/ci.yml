name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generators:
    name: Generator library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r tools/requirements.txt

      - name: Generator library tests
        # These run WITHOUT Blender. That is the point of the lib/scripts split
        # in ADR-0004: the geometry logic is where the bugs are, so it must be
        # testable on every push rather than only when someone opens Blender.
        run: python -m pytest blender/tests -q

      - name: Map constraints
        # GDD section 8's constraints, checked rather than judged by eye. This
        # is the M5 exit criterion made executable.
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "blender/lib")
          from tonight.terrain import heightfield, max_slope_degrees
          from tonight.map_layout import (
              NIGHTFALL_ISLE, NIGHTFALL_TERRAIN, place_pois, summarise, validate_map)

          field = heightfield(NIGHTFALL_TERRAIN)
          pois = place_pois(NIGHTFALL_ISLE, NIGHTFALL_TERRAIN, field)
          problems = validate_map(NIGHTFALL_ISLE, NIGHTFALL_TERRAIN, field, pois)

          for key, value in summarise(NIGHTFALL_ISLE, NIGHTFALL_TERRAIN, field, pois).items():
              print(f"  {key}: {value}")
          print(f"  maxSlopeDegrees: {max_slope_degrees(NIGHTFALL_TERRAIN, field):.2f}")

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          print("Nightfall Isle satisfies every GDD section 8 constraint.")
          EOF

      - name: Full export
        # Writes every .glb through tonight.gltf, which needs no Blender
        # (ADR-0008). This is a real export, not a dry run: the web job loads
        # what it produces, so a writer bug fails here rather than in a browser.
        run: python blender/scripts/build_all.py

      - name: Manifest is up to date
        # Content hashes in the manifest are how a generator change is reviewed.
        # A stale manifest means the committed hashes no longer describe what
        # the generators actually produce, which silently defeats that review.
        run: |
          if ! git diff --quiet -- blender/exports/manifest.json; then
            echo "::error::blender/exports/manifest.json is out of date."
            echo "Run: python3 blender/scripts/build_all.py --dry-run"
            echo "and commit the result."
            git diff -- blender/exports/manifest.json
            exit 1
          fi
          echo "Manifest matches the generators."

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No exported binaries committed
        # blender/exports is build output (ADR-0004). A committed FBX means
        # someone's local build is now the source of truth instead of the
        # Python, which is exactly the situation the pipeline exists to avoid.
        run: |
          found=$(git ls-files 'blender/exports/**' \
            | grep -Ei '\.(fbx|glb|gltf|obj|blend)$' || true)
          if [ -n "$found" ]; then
            echo "::error::Exported binaries are committed:"
            echo "$found"
            exit 1
          fi
          echo "No exported binaries in git."

      - name: Documented systems have specs
        # A system whose spec went missing is a system nobody can review.
        run: |
          status=0
          for spec in movement building combat harvesting loot storm \
                      inventory netcode match-flow; do
            if [ ! -f "docs/systems/$spec.md" ]; then
              echo "::error::Missing spec docs/systems/$spec.md"
              status=1
            fi
          done
          exit $status

  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci

      - name: Generate art
        # The client loads these; without them the sandbox refuses to boot by
        # design, because a missing mesh over a live collision grid is an
        # invisible wall. npm run predev/prebuild do this too.
        run: npm run art

      - name: Typecheck
        run: npm run typecheck

      - name: Simulation tests
        # These run in Node with no DOM. If a test needs a browser, the code
        # under test is in the wrong layer.
        run: npm test

      - name: Production build
        run: npm run build

      - name: Browser smoke test
        # Boots the built game in headless Chromium, walks, harvests and builds,
        # then asserts on the HUD. Catches the class of bug a unit test cannot:
        # the preview and the placement disagreeing, a shader failing to
        # compile, an uncaught exception at boot.
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4180 --strictPort &
          npx wait-on http://localhost:4180/ --timeout 60000
          node tools/smoke.mjs http://localhost:4180/ /tmp/tonight.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-screenshot
          path: /tmp/tonight.png
          if-no-files-found: ignore
